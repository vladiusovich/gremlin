[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pyparsing.*
    ignore::DeprecationWarning:mitmproxy.*
    ignore::DeprecationWarning:ldap3.*
markers =
    e2e: starts a real mitmdump with the addon and a local upstream server (slower)
